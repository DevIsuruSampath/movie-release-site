version: '3.8'

services:
  # Backend API
  backend:
    build: ./backend
    container_name: movie_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - movie_uploads:/app/uploads  # Persist uploads
    ports:
      - "8000:8000"
    environment:
      SUPABASE_POOLER_DB_URL: ${SUPABASE_POOLER_DB_URL:-}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_POOL_SIZE: 10
      DATABASE_MAX_OVERFLOW: 20
      DATABASE_POOL_RECYCLE_SECONDS: 1800
      DATABASE_POOL_TIMEOUT_SECONDS: 30
      SECRET_KEY: your-super-secret-jwt-key-change-this-in-production
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      STORAGE_BACKEND: local
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: 10
      PUBLIC_SITE_URL: http://localhost:3000
      SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      SUPABASE_IMAGES_BUCKET: movie-images
      SUPABASE_SUBTITLES_BUCKET: movie-subtitles
      ALLOW_PUBLIC_REGISTRATION: false
      ADMIN_REGISTRATION_CODE: change-this-to-secure-code
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build: ./frontend
    container_name: movie_frontend
    command: ["node", "server.js"]
    ports:
      - "3000:3000"
    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_URL: http://localhost:3000
      NEXT_PUBLIC_API_TIMEOUT: 30000
      NODE_ENV: production
    depends_on:
      - backend

volumes:
  movie_uploads:
    driver: local

networks:
  default:
    name: movie_network
