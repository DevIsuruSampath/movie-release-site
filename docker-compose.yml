version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: movie_db
    environment:
      POSTGRES_USER: movie_user
      POSTGRES_PASSWORD: movie_pass
      POSTGRES_DB: movie_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie_user -d movie_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build: ./backend
    container_name: movie_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - movie_uploads:/app/uploads  # Persist uploads
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://movie_user:movie_pass@postgres:5432/movie_db
      SECRET_KEY: your-super-secret-jwt-key-change-this-in-production
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: 10
      PUBLIC_SITE_URL: http://localhost:3000
      TELEGRAM_API_ID: ""
      TELEGRAM_API_HASH: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_PRIVATE_CHANNEL_ID: ""
      TELEGRAM_BOT_TOKEN_ENCRYPTION_KEY: change-me-with-fernet-key
      TELEGRAM_REQUEST_TIMEOUT: 15
      TELEGRAM_ENABLED_DEFAULT: "false"
      TELEGRAM_STORAGE_ENABLED_DEFAULT: "false"
      TELEGRAM_STORAGE_MODE_DEFAULT: local_only
      ALLOW_PUBLIC_REGISTRATION: false
      ADMIN_REGISTRATION_CODE: change-this-to-secure-code
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build: ./frontend
    container_name: movie_frontend
    command: ["node", "server.js"]
    ports:
      - "3000:3000"
    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_URL: http://localhost:3000
      NEXT_PUBLIC_API_TIMEOUT: 30000
      NODE_ENV: production
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  movie_uploads:
    driver: local

networks:
  default:
    name: movie_network
